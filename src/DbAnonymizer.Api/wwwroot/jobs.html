<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DbAnonymizer — Задачи обезличивания</title>
  <style>
    :root { color-scheme: light; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      margin: 0; padding: 1.5rem; line-height: 1.5;
      background: #f5f6f8; color: #1f2933;
    }
    main { max-width: 960px; margin: 0 auto; background: #fff; border: 1px solid #e1e4e8; border-radius: 8px; padding: 1.5rem; }
    h1 { margin-top: 0; font-size: 1.5rem; }
    a { color: #0b5fa5; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #e1e4e8; vertical-align: top; }
    th { background: #fafbfc; font-weight: 600; white-space: nowrap; }
    .error { color: #b42318; background: #fef3f2; border: 1px solid #fecdca; padding: 0.75rem 1rem; border-radius: 6px; }
    .empty { color: #6b7280; text-align: center; padding: 1.5rem 0; }
  </style>
</head>
<body>
  <main>
    <h1>Задачи обезличивания</h1>
    <p><a href="index.html">&larr; На главную</a></p>
    <div id="error" class="error" hidden></div>
    <table id="jobs-table">
      <thead>
        <tr><th>ID</th><th>Статус</th><th>Источник</th><th>Создана</th><th>Отчёт</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <p id="empty" class="empty" hidden>Задач пока нет. Создайте задачу через POST /jobs.</p>
  </main>
  <script>
    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    // Статусы JobStatus (числовые значения из API, System.Text.Json сериализует enum как число)
    const statusLabels = {
      0: 'Создана', 1: 'Загрузка данных', 2: 'Ожидает ревью', 3: 'Заморожен',
      4: 'Обогащение', 5: 'Применение', 6: 'Проверка', 7: 'Завершена', 8: 'Ошибка'
    };

    async function loadJobs() {
      const errorBox = document.getElementById('error');
      const tbody = document.querySelector('#jobs-table tbody');
      try {
        const response = await fetch('/jobs');
        if (!response.ok) throw new Error(`GET /jobs: HTTP ${response.status}`);
        const jobs = await response.json();
        if (jobs.length === 0) {
          document.getElementById('empty').hidden = false;
          return;
        }
        for (const job of jobs) {
          const row = document.createElement('tr');
          // dumpFilePath приходит из POST /jobs — user input, экранируем
          const source = job.source && job.source.dumpFilePath ? job.source.dumpFilePath : 'live';
          // Битое значение createdAt не должно ронять весь список (RangeError у toLocaleString)
          let createdAt = '—';
          if (job.createdAt) {
            const date = new Date(job.createdAt);
            if (!isNaN(date.getTime())) createdAt = date.toLocaleString('ru-RU');
          }
          const hasReport = job.status === 7; // Complete: отчёт записан в VerifyPhase
          row.innerHTML =
            '<td><a href="/plan-review.html?id=' + encodeURIComponent(job.id) + '">' + esc(job.id) + '</a></td>' +
            '<td>' + (statusLabels[job.status] ?? 'Неизвестно (' + job.status + ')') + '</td>' +
            '<td>' + esc(source) + '</td>' +
            '<td>' + createdAt + '</td>' +
            '<td>' + (hasReport
              ? '<a href="/report.html?id=' + encodeURIComponent(job.id) + '">Отчёт</a>'
              : '&mdash;') + '</td>';
          tbody.appendChild(row);
        }
      } catch (err) {
        errorBox.textContent = 'Не удалось загрузить задачи: ' + err.message;
        errorBox.hidden = false;
      }
    }

    loadJobs();
  </script>
</body>
</html>
